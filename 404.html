<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spinther Light</title>
<link rel="icon" href="/logo.jpg">
<style>
  :root { --fondo: #e8eef8; --texto: #1d2b4f; --suave: #5a6785; --enlace: #1f5fd6; }
  html, body { margin: 0; min-height: 100%; background: var(--fondo); color: var(--texto);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  main { min-height: 100vh; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 24px; padding: 32px 16px; box-sizing: border-box; text-align: center; }
  .logo { width: min(320px, 80%); height: auto; border-radius: 6%; display: block;
    box-shadow: 0 20px 50px rgba(11, 26, 58, .25); }
  h1 { margin: 0; font-size: 28px; }
  p { margin: 0; max-width: 420px; font-size: 18px; line-height: 1.4; color: var(--suave); }
  a { color: var(--enlace); font-weight: 600; text-decoration: none; }
  a:hover { text-decoration: underline; }
  [hidden] { display: none; }
</style>
</head>
<body>
<main>
  <img class="logo" src="/logo.jpg" alt="Spinther Light">
  <section id="descarga" hidden>
    <h1 data-en="Download SustainTrack" data-es="Descarga SustainTrack"></h1>
    <p data-en="Coming soon to the App Store and Google Play"
       data-es="Pronto en App Store y Google Play"></p>
  </section>
  <section id="noexiste" hidden>
    <h1 data-en="Page not found" data-es="Página no encontrada"></h1>
    <p><a href="/" data-en="Go to the home page" data-es="Ir al inicio"></a></p>
  </section>
</main>
<script>
  (function () {
    var es = (navigator.language || "en").toLowerCase().indexOf("es") === 0;
    var esPost = location.pathname.indexOf("/p/") === 0;
    if (esPost) {
      var m = document.createElement("meta");
      m.name = "robots";
      m.content = "noindex";
      document.head.appendChild(m);
    }
    document.documentElement.lang = es ? "es" : "en";
    document.getElementById(esPost ? "descarga" : "noexiste").hidden = false;
    var nodos = document.querySelectorAll("[data-en]");
    for (var i = 0; i < nodos.length; i++) {
      nodos[i].textContent = nodos[i].getAttribute(es ? "data-es" : "data-en");
    }
  })();
</script>
</body>
</html>
