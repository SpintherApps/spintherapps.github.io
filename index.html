<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spinther Light</title>
<meta name="description" content="Spinther Light — ideas que brillan en cada toque.">
<link rel="icon" href="logo.jpg">
<style>
  :root { --fondo: #e8eef8; --texto: #1d2b4f; --suave: #5a6785; --enlace: #1f5fd6; }
  html, body { margin: 0; min-height: 100%; background: var(--fondo); color: var(--texto);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  main { min-height: 100vh; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 32px; padding: 24px 16px; box-sizing: border-box; text-align: center; }
  img { width: min(520px, 100%); height: auto; border-radius: 6%; display: block;
    box-shadow: 0 20px 50px rgba(11, 26, 58, .25); }
  .contacto { font-size: 15px; letter-spacing: .12em; text-transform: uppercase; color: var(--suave); }
  .contacto a { display: inline-block; margin-top: 6px; font-size: 18px; letter-spacing: 0;
    text-transform: none; color: var(--enlace); text-decoration: none; font-weight: 600; }
  .contacto a:hover { text-decoration: underline; }
</style>
</head>
<body>
<main>
  <img src="logo.jpg" alt="Spinther Light — Ideas que brillan en cada toque">
  <div class="contacto">
    Contact us:<br>
    <a href="mailto:egnunez@yahoo.com">egnunez@yahoo.com</a>
  </div>
</main>
</body>
</html>
